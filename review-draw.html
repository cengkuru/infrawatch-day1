:root{--bg:#FBFBF9;--ink:#2C4143;--slate:#58707B;--line:#E3E3DA;--red:#D60000;--coin:#D8D8CD;--tip-bg:#2C4143;--tip-ink:#F7F7F7;color-scheme:light;
 --serif:"Newsreader",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
:root[data-theme="dark"]{--bg:#1B2628;--ink:#EDEDE6;--slate:#A7B6BB;--line:#36474A;--red:#FF4A4A;--coin:#3A4A4C;--tip-bg:#EDEDE6;--tip-ink:#1B2628;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-block:40px 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.theme{font:inherit;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--slate);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.theme:hover{color:var(--ink);border-color:var(--slate)}
.theme:focus-visible,.c:focus-visible,.foot a:focus-visible,.foot button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,6.5vw,58px);line-height:1.06;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
h1 b{color:var(--red);font-weight:500}
.sub{color:var(--slate);margin:0 0 44px;max-width:52ch}
.p{display:grid;grid-template-columns:140px 1fr;gap:6px 18px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.p:last-of-type{border-bottom:1px solid var(--line)}
.p>div:first-child{grid-row:1/3}
.p h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;line-height:1.2}
.p .k{font-family:var(--mono);font-size:11.5px;color:var(--slate);display:block;margin-top:2px;white-space:nowrap}
.coins{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.c{width:16px;height:16px;border-radius:50%;background:var(--coin);border:0;padding:0;margin:0;cursor:default;transition:transform .7s cubic-bezier(.2,.7,.2,1),background .15s linear .35s,box-shadow .15s}
.c.spin{transform:rotateY(900deg)}
.c.in{background:var(--red)}
.c:hover,.c.on{box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.picks{grid-column:2;margin:4px 0 0;padding:0;list-style:none;font-size:14.5px;line-height:1.45}
.picks li{opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s}
.picks li.show{opacity:1;transform:none}
.picks .no{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-right:6px}
.ppp{font-family:var(--mono);font-size:10.5px;color:var(--red);margin-left:6px;letter-spacing:.04em}
.p.held h2,.p.held .k{color:var(--slate)}
.p.held .c{opacity:.45}
#tip{position:fixed;z-index:9;max-width:min(360px,calc(100vw - 32px));background:var(--tip-bg);color:var(--tip-ink);font-size:13px;line-height:1.35;padding:7px 10px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 24px rgba(0,0,0,.14)}
#tip.show{opacity:1}
#tip .no{font-family:var(--mono);font-size:11px;opacity:.75;margin-right:6px}
#tip .ppp{color:inherit;opacity:.85}
.foot{margin-top:44px;font-family:var(--mono);font-size:11.5px;color:var(--slate);display:grid;gap:12px}
.foot .row{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline}
.foot a,.foot button{font:inherit;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.foot a:hover,.foot button:hover{color:var(--red)}
.foot .lbl{min-width:84px}
details{margin-top:20px;font-size:13px;color:var(--slate);max-width:62ch}
summary{font-family:var(--mono);font-size:11.5px;cursor:pointer;color:var(--slate)}
details p{margin:8px 0 0}
@media (max-width:560px){.p{grid-template-columns:1fr}.p>div:first-child{grid-row:auto}.picks{grid-column:1}.foot .lbl{min-width:0;flex-basis:100%}}
@media (prefers-reduced-motion: reduce){.c,.picks li,#tip{transition:none}}
</style>

const HELD={Cambodia:'drawn when its PPP-tagged list arrives'};
const ABSENT=[['DRC','no project list yet']];
// Infra Watch DQA 20 percent draw. Deterministic from (seed, country).
function fnv1a(str){let h=0x811c9dc5;const b=new TextEncoder().encode(str);for(const c of b){h^=c;h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(items,rand){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function drawCountry(country,rows,seed,minppp){
  const n=rows.length,k=Math.ceil(n/5);
  const ppp=rows.filter(r=>r.ppp).sort((a,b)=>a.no-b.no),oth=rows.filter(r=>!r.ppp).sort((a,b)=>a.no-b.no);
  let kp=Math.min(ppp.length,Math.floor(k*ppp.length/n+0.5));if(minppp&&ppp.length&&kp===0)kp=1;let ko=k-kp;
  const rand=mulberry32(fnv1a(seed+'|'+country));
  const sp=shuffle(ppp,rand),so=shuffle(oth,rand);
  return {country,n,p:ppp.length,k,kp,ko,orderPpp:sp.map(r=>r.no),orderOther:so.map(r=>r.no),picks:sp.slice(0,kp).concat(so.slice(0,ko)).sort((a,b)=>a.no-b.no)};
}

const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* theme: light by default, dark on request, remembered per browser */
const root=document.documentElement, tb=$('theme');
function setTheme(t){if(t==='dark'){root.dataset.theme='dark';tb.textContent='Light';tb.setAttribute('aria-pressed','true');}else{delete root.dataset.theme;tb.textContent='Dark';tb.setAttribute('aria-pressed','false');}try{localStorage.setItem('iw-draw-theme',t);}catch(e){}}
try{setTheme(localStorage.getItem('iw-draw-theme')==='dark'?'dark':'light');}catch(e){}
tb.addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));
const fp=fnv1a(JSON.stringify(FRAME)).toString(16).padStart(8,'0');
const countries=[...new Set(FRAME.map(f=>f.country))].sort();
const res=countries.map(c=>{const rows=FRAME.filter(f=>f.country===c);const d=drawCountry(c,rows,SEED);d.rows=rows.slice().sort((a,b)=>a.no-b.no);d.held=!!HELD[c];return d;});
const live=res.filter(d=>!d.held), tot=live.reduce((a,d)=>a+d.k,0), totP=live.reduce((a,d)=>a+d.kp,0), N=live.reduce((a,d)=>a+d.n,0);
$('h').innerHTML=`<b>${tot} projects</b> go to review.`;
$('sub').textContent=`One in five from each of ${live.length} partners' project lists (${N} projects), ${totP} of them PPP. Drawn once, with a seed, so the same ${tot} come out every time this page opens. Hover or tap a coin to see its project.`;
const host=$('rows');
for(const d of res){
  const sec=document.createElement('section');sec.className='p'+(d.held?' held':'');
  const set=new Set(d.picks.map(r=>r.no));
  sec.innerHTML=`<div><h2>${d.country}</h2><span class="k">${d.n} listed${d.p?' · '+d.p+' PPP':''}</span></div>
  <div class="coins">${d.rows.map(r=>`<button class="c" type="button" data-in="${!d.held&&set.has(r.no)?1:''}" data-no="${r.no}" data-name="${esc(r.project)}" data-ppp="${r.ppp?1:''}" aria-label="#${r.no} ${esc(r.project)}${r.ppp?', PPP':''}${!d.held&&set.has(r.no)?', drawn':''}"></button>`).join('')}</div>
  ${d.held?`<p class="picks" style="opacity:1"><em>${esc(HELD[d.country])}</em></p>`:`<ol class="picks">${d.picks.map(r=>`<li><span class="no">#${r.no}</span>${esc(r.project)}${r.ppp?'<span class="ppp">PPP</span>':''}</li>`).join('')}</ol>`}`;
  host.appendChild(sec);
}
for(const [c,why] of ABSENT){const sec=document.createElement('section');sec.className='p held';sec.innerHTML=`<div><h2>${c}</h2><span class="k">${why}</span></div><div class="coins"></div>`;host.appendChild(sec);}
$('meta').textContent=`seed ${SEED} · list fingerprint ${fp} · lists as at 30 Oct 2026 · Michael Cengkuru, CoST, for the CIPE Infrastructure Watch programme`;
$('how').textContent=`Each partner's project list is taken as it stood on 30 October 2026 (Indonesia: the 20 projects in its score sheets, which replaced its list). For each partner, one in five is drawn, rounded up; PPP projects form their own stratum and are drawn in proportion. The seed and the partner name feed a fixed random generator (FNV-1a into mulberry32), each stratum is shuffled once in list order, and the first projects are taken. Partners are drawn independently, so Cambodia and DRC can be added later without changing anyone else's draw. The coins only show the result. Partners score; CoST flags; CIPE decides the method.`;
/* tooltip: hover or focus a coin, tap on touch */
const tip=$('tip');let onCoin=null;
function showTip(c){onCoin&&onCoin.classList.remove('on');onCoin=c;c.classList.add('on');tip.innerHTML=`<span class="no">#${c.dataset.no}</span>${c.dataset.name}${c.dataset.ppp?'<span class="ppp"> · PPP</span>':''}${c.dataset.in?' · drawn':''}`;tip.setAttribute('aria-hidden','false');tip.classList.add('show');const r=c.getBoundingClientRect();tip.style.left='0px';tip.style.top='0px';const w=tip.offsetWidth,h=tip.offsetHeight;let x=r.left+r.width/2-w/2,y=r.top-h-10;if(y<8)y=r.bottom+10;x=Math.max(8,Math.min(x,innerWidth-w-8));tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.classList.remove('show');tip.setAttribute('aria-hidden','true');onCoin&&onCoin.classList.remove('on');onCoin=null;}
host.addEventListener('pointerover',e=>{const c=e.target.closest('.c');if(c)showTip(c);});
host.addEventListener('pointerout',e=>{if(e.target.closest('.c')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.c')))hideTip();});
host.addEventListener('focusin',e=>{const c=e.target.closest('.c');if(c)showTip(c);});
host.addEventListener('focusout',e=>{if(e.target.closest('.c'))hideTip();});
host.addEventListener('click',e=>{const c=e.target.closest('.c');if(!c)return;if(onCoin===c&&tip.classList.contains('show'))hideTip();else showTip(c);});
addEventListener('scroll',()=>{if(onCoin)showTip(onCoin);},{passive:true});
function play(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let t=reduce?0:400;
  document.querySelectorAll('.c').forEach(c=>c.classList.remove('spin','in'));document.querySelectorAll('.picks li').forEach(l=>l.classList.remove('show'));
  for(const sec of document.querySelectorAll('.p:not(.held)')){
    const coins=[...sec.querySelectorAll('.c')];
    coins.forEach((c,j)=>setTimeout(()=>{c.classList.add('spin');if(c.dataset.in)c.classList.add('in');},reduce?0:t+j*40));
    const li=[...sec.querySelectorAll('.picks li')];
    li.forEach((l,j)=>setTimeout(()=>l.classList.add('show'),reduce?0:t+coins.length*40+250+j*120));
    t+=reduce?0:coins.length*40+li.length*120+650;
  }
}
function log(){const L=['INFRA WATCH DATA QUALITY REVIEW · ONE IN FIVE DRAW','Seed: '+SEED,'Frame: partner project lists as at 30 Oct 2026 (Indonesia: its 20 scored sheets); '+FRAME.length+' projects; fingerprint fnv1a '+fp,'Rule: per partner ceil(n/5); PPP stratum in proportion, rounded to nearest; fnv1a(seed|partner) -> mulberry32 -> Fisher-Yates per stratum in list order'];
  for(const d of res){L.push('',d.country.toUpperCase()+' · listed '+d.n+' · PPP '+d.p+(d.held?' · HELD: '+HELD[d.country]:' · drawn '+d.k+' ('+d.kp+' PPP)'));if(d.held)continue;
    for(const r of d.picks)L.push('  #'+r.no+'  '+r.project+(r.ppp?'  | PPP':''));
    L.push('  shuffle order PPP: '+(d.orderPpp.join(',')||'none')+' · other: '+d.orderOther.join(','));}
  for(const [c,why] of ABSENT)L.push('',c.toUpperCase()+' · '+why);
  L.push('','TOTAL drawn '+tot+' of '+N+' listed across '+live.length+' partners; PPP drawn '+totP);return L.join('\n');}
$('copy').addEventListener('click',async()=>{const t=$('toast');try{await navigator.clipboard.writeText(log());t.textContent='Copied.';}catch(e){t.textContent='Clipboard blocked here.';}setTimeout(()=>t.textContent='',3000);});
$('replay').addEventListener('click',play);
play();
